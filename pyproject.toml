[project]
name = "prkknot"
dynamic = ["version"]
description = "Flex-Knot reconstruction of dark energy PR(k), for use with Cobaya"
authors = [{name="Adam Neil Ormondroyd", email="Adam.Ormondroyd@gmail.com"}]
readme = "README.md"
dependencies = ["numpy", "cobaya", "flexknot", "anesthetic", "fgivenx"]

[project.urls]
repository = "https://github.com/adamormondroyd/prkknot"

[project.optional-dependencies]
dev = ["black", "pre-commit"]
[build-system]
requires = ["setuptools_scm>=8"]

[tool.setuptools_scm]
version_file = "darkknot/_version.py"
